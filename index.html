<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>AEC Sinuca</title>

    <link rel="icon" href="assets/icons/favicon.ico" />
    <script>
      const restoredRoute = new URLSearchParams(window.location.search).get("route");
      const basePath =
        window.location.hostname === "127.0.0.1" ||
        window.location.hostname === "localhost"
          ? ""
          : "/sinuca-aec";

      if (restoredRoute) {
        window.history.replaceState(
          {},
          "",
          `${basePath}${restoredRoute}${window.location.hash}`,
        );
      }
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <!-- Fonte -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/home.css" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>

  <body>
    <div id="app"></div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
