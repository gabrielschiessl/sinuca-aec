<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AEC Sinuca</title>
  </head>
  <body>
    <script>
      const basePath = window.location.pathname.startsWith("/sinuca-aec")
        ? "/sinuca-aec"
        : "";
      const params = new URLSearchParams(window.location.search);
      params.set("route", "/historico");
      window.location.replace(`${basePath}/?${params.toString()}${window.location.hash}`);
    </script>
  </body>
</html>
